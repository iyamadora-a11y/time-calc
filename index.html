<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
<meta name="description" content="할인 계산, 일반 계산기, 실시간 환율, 원금 역산을 한 화면에서. 숫자패드 내장 반응형 계산기.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할인 계산기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:type" content="website">
<meta property="og:title" content="할인 계산기">
<meta property="og:description" content="할인 계산 · 일반 계산 · 환율 · 원금 역산을 한 화면에서. 숫자패드 내장 반응형 계산기.">
<meta property="og:locale" content="ko_KR">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
  /* base reset */
  *{box-sizing:border-box}
  html{color-scheme:light dark;height:100%}
  :root{
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  body{margin:0;min-height:100%;-webkit-font-smoothing:antialiased}
  img{max-width:100%}
  [hidden]{display:none !important}
  button{font:inherit}
</style>

<title>할인 계산기</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    /* SmartThings 톤 — 연한 파스텔 그라데이션 위에 흰 카드 */
    --bg:#F3F1EE;
    --grad-1:#FBDFCB;   /* 복숭아 */
    --grad-2:#F8F3EA;   /* 크림 */
    --grad-3:#DCEBD6;   /* 세이지 */
    --grad-4:#E3EAF6;   /* 옅은 블루그레이 */
    --surface:rgba(255,255,255,.88);
    --surface-solid:#FFFFFF;
    --surface-2:#F2F2F4;
    --line:rgba(22,24,29,.07);
    --line-strong:rgba(22,24,29,.16);
    --ink:#16181D;
    --muted:#64696F;
    --muted-2:#9BA0A6;
    /* 강조 — 거의 무채색 그래파이트, 포인트 틴트는 따로 */
    --accent:#24262B;
    --on-accent:#FFFFFF;
    --accent-soft:#E9EDE6;
    --accent-line:rgba(36,38,43,.18);
    --tint:#5B6F5A;     /* 세이지 포인트 */
    --save:#A3563F;
    --save-soft:#F7EDE6;
    --danger:#B4524A;
    --danger-soft:#FBEBE7;
    --shadow:0 1px 2px rgba(22,24,29,.04), 0 10px 30px rgba(22,24,29,.07);
    --radius:22px;
    --radius-sm:14px;
    --sans:"IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E0F12;
      --grad-1:#2A2220;
      --grad-2:#17181B;
      --grad-3:#182420;
      --grad-4:#181C28;
      --surface:rgba(32,34,38,.82);
      --surface-solid:#202226;
      --surface-2:#282A2F;
      --line:rgba(255,255,255,.08);
      --line-strong:rgba(255,255,255,.18);
      --ink:#ECEDEF;
      --muted:#A8ADB4;
      --muted-2:#7D838A;
      --accent:#ECEDEF;
      --on-accent:#16181D;
      --accent-soft:#2A302B;
      --accent-line:rgba(255,255,255,.22);
      --tint:#A8C3A4;
      --save:#E0A48C;
      --save-soft:#33251F;
      --danger:#F0A49A;
      --danger-soft:#3A2420;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E0F12;
    --grad-1:#2A2220;
    --grad-2:#17181B;
    --grad-3:#182420;
    --grad-4:#181C28;
    --surface:rgba(32,34,38,.82);
    --surface-solid:#202226;
    --surface-2:#282A2F;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.18);
    --ink:#ECEDEF;
    --muted:#A8ADB4;
    --muted-2:#7D838A;
    --accent:#ECEDEF;
    --on-accent:#16181D;
    --accent-soft:#2A302B;
    --accent-line:rgba(255,255,255,.22);
    --tint:#A8C3A4;
    --save:#E0A48C;
    --save-soft:#33251F;
    --danger:#F0A49A;
    --danger-soft:#3A2420;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
  }

  /* no double-tap zoom anywhere on the page (Safari 13+, Chrome) */
  *{box-sizing:border-box;touch-action:manipulation}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation}
  html,body{height:100%}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(135% 80% at 88% -5%, var(--grad-1) 0%, transparent 62%),
      radial-gradient(125% 70% at -8% 10%, var(--grad-4) 0%, transparent 58%),
      radial-gradient(140% 85% at 18% 105%, var(--grad-3) 0%, transparent 64%),
      linear-gradient(180deg, var(--grad-2) 0%, var(--bg) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  .app{
    width:100%;
    max-width:460px;
    margin-inline:auto;
    padding-inline:16px;
    padding-block:16px 40px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* ---- segmented tabs + theme switch ---- */
  .tabrow{display:flex;align-items:stretch;gap:7px}
  .themebtn{
    flex:none;width:44px;height:44px;align-self:center;
    appearance:none;cursor:pointer;padding:0;
    background:var(--surface);border:0;border-radius:50%;
    color:var(--muted);display:flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    transition:color .12s,border-color .12s;
  }
  .themebtn:hover{color:var(--ink)}
  .themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .themebtn svg{width:19px;height:19px;display:block}

  .tabs{
    flex:1;min-width:0;
    display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
    background:transparent;border:0;border-radius:999px;padding:0;
  }
  .tab{
    appearance:none;border:0;background:transparent;color:var(--muted-2);
    font-family:var(--sans);font-size:.8rem;font-weight:600;
    padding:11px 2px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;
    white-space:nowrap;letter-spacing:-.02em;
  }
  .tab[aria-selected="true"]{
    background:var(--surface);color:var(--ink);font-weight:700;
    box-shadow:0 1px 2px rgba(22,24,29,.06);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- cards ---- */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);
  }

  .field{display:flex;flex-direction:column;gap:6px}
  .field > label{font-size:.84rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
  .inputwrap{
    display:flex;align-items:center;gap:8px;
    background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-sm);
    padding:9px 11px 9px 15px;transition:border-color .15s,background .15s;cursor:text;
  }
  .inputwrap:focus-within,
  .inputwrap.is-active{border-color:var(--accent-line);background:var(--surface-solid)}
  .inputwrap input{
    flex:1;min-width:0;width:100%;
    appearance:none;border:0;background:transparent;color:var(--ink);
    font-family:var(--mono);font-weight:600;font-size:1.55rem;line-height:1.25;
    text-align:right;font-variant-numeric:tabular-nums;padding:0;
  }
  .inputwrap input:focus{outline:none}
  .inputwrap input::placeholder{color:var(--muted-2);font-weight:400}
  .unit{font-size:.95rem;font-weight:600;color:var(--muted);flex:none}

  .clearbtn{
    flex:none;appearance:none;border:0;cursor:pointer;padding:0;
    width:30px;height:30px;border-radius:50%;
    background:var(--surface-solid);color:var(--muted);opacity:1;
    border:0;
    font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .12s;
  }
  .clearbtn:hover{opacity:1}
  .clearbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;opacity:1}

  .hint{font-size:.78rem;color:var(--muted);min-height:0}
  .hint:empty{display:none}
  .hint.error{color:var(--danger);font-weight:600}

  /* ---- quick rates ---- */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .chip{
    appearance:none;cursor:pointer;
    background:var(--surface-2);border:0;border-radius:999px;
    color:var(--muted);font-family:var(--mono);font-size:.94rem;font-weight:500;
    padding:11px 4px;min-height:46px;transition:background .12s,border-color .12s,color .12s;
  }
  .chip:hover{color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--tint);font-weight:700}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- chain toggle ---- */
  .chain-row{display:flex;align-items:center;gap:9px;padding-top:0}
  .chain-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
  .chain-row label{font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer}

  /* ---- keypad ---- */
  .pad-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:.78rem;color:var(--muted);
  }
  .pad-head .target{font-weight:700;color:var(--accent)}
  .paste-btn{
    appearance:none;cursor:pointer;
    background:var(--surface-2);border:0;border-radius:999px;
    color:var(--muted);font-family:var(--sans);font-size:.78rem;font-weight:600;
    padding:6px 13px;min-height:32px;transition:border-color .12s,color .12s;
  }
  .paste-btn:hover{color:var(--ink)}
  .paste-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .key{
    appearance:none;cursor:pointer;
    background:var(--surface-2);border:0;border-radius:var(--radius-sm);
    color:var(--ink);font-family:var(--mono);font-size:1.18rem;font-weight:600;
    min-height:52px;padding:0;
    transition:background .1s,border-color .1s,transform .06s;
  }
  .key:hover{background:var(--line-strong)}
  .key:active{transform:scale(.96);background:var(--line-strong)}
  .key.fn{font-family:var(--sans);font-size:1.02rem;font-weight:700;color:var(--muted)}
  .key.wide{grid-column:span 2}
  .key.wide3{grid-column:span 3}
  .calcpad{gap:7px}
  .calcpad .key{min-height:58px;font-size:1.3rem}
  .calcpad .key.fn{font-size:1rem}
  .calcpad .key.op{font-size:1.42rem}
  .calcpad .key.eq{font-size:1.42rem}
  .key.op{color:var(--tint);font-weight:700;font-size:1.3rem}
  .key.eq{background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.3rem}
  .key.eq:hover{background:var(--accent)}

  /* ---- 일반 계산 디스플레이 ---- */
  .calcdisp{
    background:var(--accent-soft);border-radius:12px;padding:12px 14px 14px;
    display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
    gap:3px;min-height:96px;
  }
  .calcdisp .expr{
    font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--accent);
    min-height:1.2em;text-align:right;overflow-wrap:anywhere;
  }
  .calcdisp .val{
    font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;
    font-size:clamp(1.9rem,8vw,2.7rem);line-height:1.1;letter-spacing:-.02em;
    color:var(--ink);text-align:right;overflow-wrap:anywhere;
  }
  .key:disabled{opacity:.3;cursor:default;transform:none}
  .key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- result ---- */
  .rows{display:flex;flex-direction:column;gap:0}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .row .k{font-size:.86rem;color:var(--muted);flex:none}
  .row .v{font-family:var(--mono);font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
  .row.save .v{color:var(--save);font-weight:600}

  .total{
    background:var(--accent-soft);border-radius:var(--radius-sm);padding:16px 16px 18px;
    display:flex;flex-direction:column;gap:3px;
  }
  .total .k{font-size:.82rem;font-weight:700;color:var(--tint);letter-spacing:.01em}
  .total .v{
    font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;
    font-size:clamp(2.1rem,8.5vw,2.9rem);line-height:1.1;letter-spacing:-.02em;color:var(--ink);
    overflow-wrap:anywhere;
  }
  .total .v .won{font-size:.5em;font-weight:500;margin-left:.3em;color:var(--muted)}
  .calcdisp{border-radius:var(--radius-sm)}

  .savebar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--save-soft);border-radius:999px;padding:11px 16px;
  }
  .savebar .k{font-size:.82rem;font-weight:600;color:var(--save)}
  .savebar .v{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--save);font-variant-numeric:tabular-nums}

  /* ---- flow ---- */
  .flow{display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 0 0}
  .flow .amt{font-family:var(--mono);font-size:1.12rem;font-weight:600;font-variant-numeric:tabular-nums}
  .flow .amt.dim{color:var(--muted);font-weight:500}
  .flow .step{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
  .flow .arrow{color:var(--muted-2);font-size:.95rem;line-height:1}
  .flow .tagline{font-size:.78rem;font-weight:600;color:var(--save);font-family:var(--sans)}
  .note{
    font-size:.79rem;color:var(--muted);background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;line-height:1.45;
  }
  .note b{color:var(--ink);font-family:var(--mono);font-weight:600}

  /* ---- actions ---- */
  .actions{display:grid;grid-template-columns:1fr;gap:12px}
  .actions.two{grid-template-columns:1fr 1fr}
  .actions.three{grid-template-columns:repeat(3,1fr);column-gap:8px;row-gap:12px}
  .actions.three .btn{font-size:.88rem;padding-inline:4px;letter-spacing:-.02em}
  .actions.three .btn.primary{grid-column:1 / -1;font-size:.95rem}
  .card-actions{display:grid;grid-template-columns:1fr;padding-top:0;gap:12px}
  .card-actions.two{grid-template-columns:1fr 1fr}
  .card-actions.three{grid-template-columns:repeat(3,1fr);column-gap:8px;row-gap:12px}
  .card-actions.three .btn{font-size:.88rem;padding-inline:4px;letter-spacing:-.02em}
  .card-actions.three .btn.primary{grid-column:1 / -1;font-size:.95rem}
  .card-actions .btn{width:100%}
  .card-actions .btn.primary{background:var(--accent);color:var(--on-accent)}

  /* ---- 최근 계산 목록 ---- */
  .histlist{display:flex;flex-direction:column;gap:0}
  .histrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:8px 0;border-bottom:1px solid var(--line);
  }
  /* "보내기"를 누르면 펼쳐지는 선택 줄 — 행 전체 폭을 쓰고 오른쪽에 정렬된다 */
  .histmenu{display:flex;gap:5px;flex-basis:100%;justify-content:flex-end;flex-wrap:wrap}
  .histsend.open{background:var(--accent);color:var(--on-accent)}
  .histsend.open:hover{background:var(--accent)}
  .histrow:last-child{border-bottom:0}
  .histmain{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;align-items:flex-start;text-align:left}
  .histpick{
    appearance:none;background:transparent;border:0;cursor:pointer;
    font:inherit;color:inherit;margin:0;padding:4px 6px;border-radius:12px;
    transition:background .12s;
  }
  .histpick:hover{background:var(--surface-2)}
  .histpick:active{background:var(--line-strong)}
  .histpick:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .hexpr{font-family:var(--mono);font-size:.73rem;color:var(--muted-2);overflow-wrap:anywhere}
  .hval{
    font-family:var(--mono);font-size:1.02rem;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere;
  }
  .histtools{display:flex;gap:6px;align-items:center;flex:none}
  .histactions{display:flex;gap:5px;flex:none}
  .histdel{color:var(--danger)}
  .histdel:hover{background:var(--danger-soft)}
  .histsend{
    flex:none;appearance:none;cursor:pointer;white-space:nowrap;
    background:var(--surface-2);border:0;border-radius:999px;
    color:var(--tint);font-family:var(--sans);font-size:.73rem;font-weight:700;
    padding:6px 9px;min-height:34px;letter-spacing:-.02em;transition:border-color .12s;
  }
  .histsend:hover{background:var(--line-strong)}
  .histsend:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .histempty{font-size:.8rem;color:var(--muted-2);padding:4px 0}

  /* ---- 탭 순서 변경 ---- */
  .orderbar{display:flex;justify-content:center}
  .ordertoggle{
    appearance:none;cursor:pointer;background:transparent;border:0;
    color:var(--muted-2);font-family:var(--sans);font-size:.8rem;font-weight:600;
    padding:8px 14px;border-radius:10px;transition:color .12s;
  }
  .ordertoggle:hover{color:var(--ink)}
  .ordertoggle[aria-expanded="true"]{color:var(--ink)}
  .ordertoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .orderlist{display:flex;flex-direction:column;gap:0}
  .orderrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px solid var(--line);
  }
  .orderrow:last-child{border-bottom:0}
  .ordername{display:flex;align-items:baseline;gap:8px;min-width:0}
  .ordernum{font-family:var(--mono);font-size:.74rem;color:var(--muted-2);flex:none}
  .orderlabel{font-size:.94rem;font-weight:600}
  .orderbtns{display:flex;gap:6px;flex:none}
  .orderbtn{
    appearance:none;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:0;
    background:var(--surface-2);border:0;color:var(--muted);
    font-size:1rem;font-weight:700;transition:background .12s,color .12s;
  }
  .orderbtn:hover:not(:disabled){background:var(--line-strong);color:var(--ink)}
  .orderbtn:disabled{opacity:.3;cursor:default;color:var(--muted)}
  .orderbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .orderhint{font-size:.76rem;color:var(--muted-2);margin:0}

  /* ---- 환율 ---- */
  .fxrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
  .fxsel{display:flex;flex-direction:column;gap:6px;min-width:0}
  .fxsel-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
  .fxsel label{font-size:.84rem;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .favbtn{
    flex:none;appearance:none;cursor:pointer;padding:0;
    width:26px;height:24px;border:0;border-radius:6px;background:transparent;
    color:var(--line-strong);font-size:1.05rem;line-height:1;transition:color .12s;
  }
  .favbtn:hover{color:var(--muted-2)}
  .favbtn[aria-pressed="true"]{color:#D8A51D}
  .favbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fxsel select{
    width:100%;appearance:none;cursor:pointer;
    background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-sm);
    color:var(--ink);font-family:var(--sans);font-size:.92rem;font-weight:600;
    padding:12px 10px;min-height:50px;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:28px;text-overflow:ellipsis;
  }
  .fxsel select:focus{outline:none;border-color:var(--accent-line);background:var(--surface-solid)}
  .fxswap{
    flex:none;appearance:none;cursor:pointer;
    width:44px;height:50px;border-radius:999px;
    background:var(--surface-2);border:0;color:var(--tint);
    font-size:1.1rem;font-weight:700;padding:0;transition:background .12s;
  }
  .fxswap:hover{background:var(--line-strong)}
  .fxswap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fxmeta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:.76rem;color:var(--muted);
  }
  .fxmeta .rate{min-width:0;overflow-wrap:anywhere}
  .fxmeta .rate b{color:var(--ink);font-weight:600}
  .fxstamp{font-size:.72rem;color:var(--muted-2);font-family:var(--mono)}
  .fxstamp .live{color:var(--tint);font-weight:700}
  .btn{
    appearance:none;cursor:pointer;min-height:52px;border-radius:999px;
    font-family:var(--sans);font-size:.95rem;font-weight:600;
    border:0;background:var(--surface-2);color:var(--muted);
    transition:background .12s,color .12s,transform .08s;
  }
  .btn:hover{color:var(--ink)}
  .btn:active{transform:scale(.99)}
  .btn.primary{
    background:var(--accent);color:var(--on-accent);font-weight:700;
    box-shadow:0 2px 10px rgba(22,24,29,.12);
  }
  .btn.primary:hover{color:var(--on-accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:disabled:hover{color:var(--muted)}

  .copybox{
    width:100%;font-family:var(--mono);font-size:.82rem;line-height:1.6;
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px 13px;color:var(--ink);resize:none;
  }

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

<body>

<script>
(function(){
  "use strict";

  var QUICK = [5,10,15,20,25,30,40,50];
  var $ = function(id){ return document.getElementById(id); };

  var raf = window.requestAnimationFrame
    ? function(fn){ window.requestAnimationFrame(fn); }
    : function(fn){ setTimeout(fn, 16); };

  /* ---------- number helpers ---------- */
  function digitsOnly(s){ return String(s == null ? "" : s).replace(/[^0-9]/g, ""); }
  function decimalOnly(s){
    var t = String(s == null ? "" : s).replace(/[^0-9.]/g, "");
    var i = t.indexOf(".");
    if (i !== -1) t = t.slice(0, i + 1) + t.slice(i + 1).replace(/\./g, "");
    return t;
  }
  /* 붙여넣기용 — 문장 안에서 숫자 "하나"만 골라낸다.
     예전에는 텍스트의 모든 숫자를 이어붙여, 환율 결과를 복사해 붙여넣으면
     10,000,007,409,610.074096 같은 값이 만들어졌다. */
  function pickNumber(text){
    var s = String(text == null ? "" : text);
    /* "=" 또는 "→" 뒤에 오는 숫자가 결과값이다 (계산기 식, 환율 변환 문장) */
    var m = s.match(/[=→⇒]\s*(-?\d[\d,]*(?:\.\d+)?)/);
    if (m) return m[1];
    var f = s.match(/-?\d[\d,]*(?:\.\d+)?/);
    return f ? f[0] : "";
  }

  function group(s){
    var d = digitsOnly(s);
    if (d === "") return "";
    d = d.replace(/^0+(?=\d)/, "");
    return d.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  /* 소수점을 허용하는 금액 서식 — 환율 탭처럼 19.99 같은 값이 들어오는 칸에 쓴다. */
  function groupDecimal(s){
    var t = decimalOnly(s);
    if (t === "") return "";
    var parts = t.split(".");
    var ip = parts[0].replace(/^0+(?=\d)/, "");
    if (ip === "") ip = "0";
    ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.length > 1 ? ip + "." + parts[1] : ip;
  }
  function won(n){
    if (!isFinite(n)) return "—";
    return Math.round(n).toLocaleString("ko-KR") + "원";
  }
  function wonBig(n){
    if (!isFinite(n)) return "—";
    return Math.round(n).toLocaleString("ko-KR") + '<span class="won">원</span>';
  }
  function pct(n){
    if (!isFinite(n)) return "—";
    return (Math.round(n * 100) / 100).toLocaleString("ko-KR") + "%";
  }

  function fireInput(el){
    var ev;
    try { ev = new Event("input", { bubbles: true }); }
    catch(e){ ev = document.createEvent("Event"); ev.initEvent("input", true, false); }
    el.dispatchEvent(ev);
  }

  /* Formatting is never applied inside the input handler: rewriting el.value while the
     browser/IME is still processing the keystroke can swallow the character. Calculation
     runs immediately from the raw text; the comma pass is deferred to the next frame. */
  function bindAmount(el, onChange, formatter){
    var composing = false, queued = false;
    var fmt = formatter || group;

    function applyFormat(){
      queued = false;
      if (composing) return;
      var before = el.value;
      var formatted = fmt(before);
      if (formatted === before) return;

      var caret = el.selectionStart == null ? before.length : el.selectionStart;
      var digitsBefore = digitsOnly(before.slice(0, caret)).length;
      el.value = formatted;

      var pos = formatted.length, seen = 0;
      if (digitsBefore <= 0){
        pos = 0;
      } else {
        for (var k = 0; k < formatted.length; k++){
          var c = formatted.charAt(k);
          if (c >= "0" && c <= "9") seen++;
          if (seen >= digitsBefore){ pos = k + 1; break; }
        }
      }
      if (document.activeElement === el){
        try { el.setSelectionRange(pos, pos); } catch(e){}
      }
      onChange();
    }

    function schedule(){
      onChange();
      if (composing || queued) return;
      queued = true;
      raf(applyFormat);
    }

    el.addEventListener("compositionstart", function(){ composing = true; });
    el.addEventListener("compositionend", function(){ composing = false; schedule(); });
    el.addEventListener("input", schedule);
    el.addEventListener("change", schedule);
    el.addEventListener("blur", function(){ composing = false; queued = false; applyFormat(); });
  }

  function bindRate(el, onChange){
    var composing = false, queued = false;

    function applyClean(){
      queued = false;
      if (composing) return;
      var v = decimalOnly(el.value);
      if (v === el.value) return;
      var caret = el.selectionStart;
      var pos = caret == null ? v.length : Math.min(caret, v.length);
      el.value = v;
      if (document.activeElement === el){
        try { el.setSelectionRange(pos, pos); } catch(e){}
      }
      onChange();
    }

    function schedule(){
      onChange();
      if (composing || queued) return;
      queued = true;
      raf(applyClean);
    }

    el.addEventListener("compositionstart", function(){ composing = true; });
    el.addEventListener("compositionend", function(){ composing = false; schedule(); });
    el.addEventListener("input", schedule);
    el.addEventListener("change", schedule);
    el.addEventListener("blur", function(){ composing = false; queued = false; applyClean(); });
  }

  /* ---------- quick rate chips ---------- */
  function buildQuick(host, input, onChange){
    QUICK.forEach(function(r){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = r + "%";
      b.setAttribute("aria-pressed", "false");
      b.dataset.rate = String(r);
      b.addEventListener("click", function(){ input.value = String(r); onChange(); });
      host.appendChild(b);
    });
  }
  function syncQuick(host, value){
    var chips = host.querySelectorAll(".chip");
    for (var i = 0; i < chips.length; i++){
      chips[i].setAttribute("aria-pressed", Number(chips[i].dataset.rate) === value ? "true" : "false");
    }
  }

  /* ---------- on-screen keypad ---------- */
  var KEYS = [
    { t:"7" }, { t:"8" }, { t:"9" }, { t:"←", act:"back", fn:true, aria:"한 글자 지우기" },
    { t:"4" }, { t:"5" }, { t:"6" }, { t:"C", act:"clear", fn:true, aria:"입력 칸 비우기" },
    { t:"1" }, { t:"2" }, { t:"3" }, { t:"이동", act:"next", fn:true, aria:"다음 입력 칸으로 이동" },
    { t:"00" }, { t:"0" }, { t:"k", act:"kilo", fn:true, aria:"1,000 곱하기" }, { t:".", dot:true }
  ];

  /* 환율 탭용 — 입력칸이 하나라 "이동" 자리에 통화 전환(⇆)을 둔다 */
  var KEYS_SINGLE = [
    { t:"7" }, { t:"8" }, { t:"9" }, { t:"←", act:"back", fn:true, aria:"한 글자 지우기" },
    { t:"4" }, { t:"5" }, { t:"6" }, { t:"C", act:"clear", fn:true, aria:"입력 칸 비우기" },
    { t:"1" }, { t:"2" }, { t:"3" }, { t:"⇆", act:"next", fn:true, aria:"통화 서로 바꾸기" },
    { t:"00" }, { t:"0" }, { t:"k", act:"kilo", fn:true, aria:"1,000 곱하기" }, { t:".", dot:true }
  ];

  /* k — 입력칸의 현재 값에 1,000을 곱한다 (25 → 25,000 / 1.5 → 1,500) */
  function kiloField(el){
    var amount = el.dataset.kind === "amount";
    var raw = amount ? digitsOnly(el.value) : decimalOnly(el.value);
    if (raw === "" || raw === ".") return;
    var n = parseFloat(raw);
    if (!isFinite(n)) return;
    var scaled = n * 1000;
    el.value = amount ? group(String(Math.round(scaled))) : groupDecimal(trimNum(scaled));
    try { el.setSelectionRange(el.value.length, el.value.length); } catch(e){}
  }

  function makeKeypad(host, getTarget, onChange, onNext, keys){
    var dotKey = null, kiloKey = null;

    (keys || KEYS).forEach(function(def){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "key" + (def.fn ? " fn" : "") + (def.wide ? " wide" : "") + (def.wide3 ? " wide3" : "");
      b.textContent = def.t;
      if (def.aria) b.setAttribute("aria-label", def.aria);
      if (def.dot) dotKey = b;
      if (def.act === "kilo") kiloKey = b;

      /* keep focus (and the caret) in the field the pad is typing into */
      b.addEventListener("mousedown", function(ev){ ev.preventDefault(); });

      b.addEventListener("click", function(){
        if (def.act === "next"){ onNext(); return; }
        var el = getTarget();
        if (!el) return;
        /* read-only fields raise no system keyboard, so focusing one just shows the caret */
        if (el.readOnly && document.activeElement !== el){
          try { el.focus({ preventScroll: true }); } catch(e){ el.focus(); }
        }
        if (def.act === "clear"){
          el.value = "";
        } else if (def.act === "back"){
          backspace(el);
        } else if (def.act === "kilo"){
          kiloField(el);
        } else {
          insert(el, def.t);
        }
        fireInput(el);
        onChange();
      });

      host.appendChild(b);
    });

    return {
      sync: function(){
        var el = getTarget();
        if (dotKey) dotKey.disabled = !el || el.dataset.kind === "amount";
        /* 할인율 칸에서 ×1,000 은 의미가 없다 */
        if (kiloKey) kiloKey.disabled = !el || el.dataset.kind === "rate";
      }
    };
  }

  /* An unfocused field reports a stale selection (often 0), which would insert at the
     front of an existing number — treat it as "caret at the end" instead. */
  function caretRange(el){
    var end = el.value.length;
    if (document.activeElement !== el) return [end, end];
    var s = el.selectionStart, e = el.selectionEnd;
    if (s == null || e == null) return [end, end];
    return [s, e];
  }

  function insert(el, text){
    var v = el.value;
    var r = caretRange(el), start = r[0], end = r[1];
    el.value = v.slice(0, start) + text + v.slice(end);
    var pos = start + text.length;
    try { el.setSelectionRange(pos, pos); } catch(e){}
  }

  function backspace(el){
    var v = el.value;
    var r = caretRange(el), start = r[0], end = r[1];
    if (start !== end){
      el.value = v.slice(0, start) + v.slice(end);
      try { el.setSelectionRange(start, start); } catch(e){}
      return;
    }
    if (start === 0) return;
    var cut = start;
    if (v.charAt(cut - 1) === ",") cut--;   // step over a separator so a digit is removed
    if (cut === 0) return;
    el.value = v.slice(0, cut - 1) + v.slice(start);
    try { el.setSelectionRange(cut - 1, cut - 1); } catch(e){}
  }

  /* ---------- per-field clear buttons ---------- */
  function bindClearButtons(root, onChange){
    var btns = root.querySelectorAll(".clearbtn");
    Array.prototype.forEach.call(btns, function(b){
      var el = $(b.dataset.clear);
      if (!el) return;
      b.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
      b.addEventListener("click", function(){
        el.value = "";
        fireInput(el);
        onChange();
      });
    });
  }
  function syncClearButtons(root){
    var btns = root.querySelectorAll(".clearbtn");
    Array.prototype.forEach.call(btns, function(b){
      var el = $(b.dataset.clear);
      b.hidden = !el || el.value === "";
    });
  }

  function flowNode(host, items){
    host.innerHTML = "";
    items.forEach(function(it){
      if (it.type === "amt"){
        var a = document.createElement("div");
        a.className = "amt" + (it.dim ? " dim" : "");
        a.textContent = it.text;
        host.appendChild(a);
      } else {
        var s = document.createElement("div");
        s.className = "step";
        s.innerHTML = '<span class="arrow">&#8595;</span><span class="tagline">' + it.text + '</span><span class="arrow">&#8595;</span>';
        host.appendChild(s);
      }
    });
  }

  /* flash 는 makeFlash 가 만든 함수 — 버튼 라벨을 잠깐 바꿨다가 되돌린다 */
  function copyText(text, box, flash){
    var done = function(){ flash("복사됨 ✓"); };
    var fallback = function(){
      box.hidden = false;
      box.value = text;
      try { box.select(); box.setSelectionRange(0, text.length); } catch(e){}
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e){}
      if (ok){ box.hidden = true; done(); }
      else { flash("아래에서 직접 복사"); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* Temporary label on a button. The pending timer is cleared each time, so a quick
     second message is not wiped by the first one's timeout. */
  function makeFlash(btn){
    var base = btn.textContent, timer = null;
    return function(msg){
      if (timer) clearTimeout(timer);
      btn.textContent = msg;
      timer = setTimeout(function(){ btn.textContent = base; timer = null; }, 1600);
    };
  }

  /* ---------- paste into the field the keypad is aimed at ----------
     Mobile fields are read-only (so no system keyboard appears), which also blocks the
     normal paste gesture — this button reads the clipboard instead. */
  function bindPaste(btn, getTarget, onChange){
    var flash = makeFlash(btn);
    btn.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
    btn.addEventListener("click", function(){
      var el = getTarget();
      if (!el) return;
      if (!navigator.clipboard || !navigator.clipboard.readText){
        flash("지원 안 됨");
        return;
      }
      navigator.clipboard.readText().then(function(text){
        var picked = pickNumber(text);
        var clean = el.dataset.kind === "amount" ? digitsOnly(picked) : decimalOnly(picked);
        clean = clean.replace(/^\.+/, "");
        if (!clean){ flash("숫자 없음"); return; }
        el.value = clean;
        fireInput(el);
        onChange();
        flash("붙여넣음 ✓");
      }, function(){
        flash("권한 거부");
      });
    });
  }

  /* ---------- 배경 모드 (밝게 / 어둡게) ---------- */
  var THEME_ORDER = ["light", "dark"];
  var THEME_LABEL = { light: "배경 모드: 밝게", dark: "배경 모드: 어둡게" };
  var THEME_ICON = {
    light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6' +
          'M2.6 12h2.2M19.2 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z"/></svg>'
  };

  function setupTheme(btn){
    /* 저장된 선택이 없으면 기기의 다크 모드 설정을 첫 값으로 쓰고,
       그 다음부터는 사용자가 고른 값만 따른다. */
    var mode = null;
    try {
      var saved = localStorage.getItem("discount-calc-theme");
      if (THEME_ORDER.indexOf(saved) !== -1) mode = saved;
    } catch(e){}
    if (!mode){
      var prefersDark = false;
      try {
        prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch(e){}
      mode = prefersDark ? "dark" : "light";
    }

    function apply(){
      document.documentElement.setAttribute("data-theme", mode);
      btn.innerHTML = THEME_ICON[mode];
      btn.title = THEME_LABEL[mode];
      btn.setAttribute("aria-label", THEME_LABEL[mode] + " (눌러서 전환)");
      try { localStorage.setItem("discount-calc-theme", mode); } catch(e){}
    }

    btn.addEventListener("click", function(){
      mode = THEME_ORDER[(THEME_ORDER.indexOf(mode) + 1) % THEME_ORDER.length];
      apply();
    });
    apply();
  }

  /* ---------- active-field tracking ---------- */
  function trackActive(inputs, onSwitch){
    var active = inputs[0];
    inputs.forEach(function(el){
      el.addEventListener("focus", function(){ active = el; onSwitch(); });
    });
    return {
      get: function(){
        if (active && active.offsetParent === null && active !== inputs[0]) active = inputs[0];
        return active;
      },
      set: function(el){ active = el; onSwitch(); }
    };
  }
  /* "이동" key — steps the pad's target to the next visible field, wrapping around.
     Focus follows only when a field already had it, so the pad doesn't summon the
     on-screen keyboard on mobile. */
  function stepTarget(ctl, inputs){
    var visible = [];
    inputs.forEach(function(el){ if (el.offsetParent !== null) visible.push(el); });
    if (!visible.length) return;
    var i = visible.indexOf(ctl.get());
    var next = visible[(i + 1) % visible.length];
    var hadFocus = visible.indexOf(document.activeElement) !== -1;
    ctl.set(next);
    if (hadFocus){
      next.focus();
      try { next.setSelectionRange(next.value.length, next.value.length); } catch(e){}
    }
  }

  function markActive(inputs, activeEl){
    inputs.forEach(function(el){
      var wrap = el.parentNode;
      if (!wrap || !wrap.classList) return;
      if (el === activeEl) wrap.classList.add("is-active");
      else wrap.classList.remove("is-active");
    });
  }

  /* ================= 할인 계산 ================= */
  var panelD = $("panel-discount");
  var dAmount = $("d-amount"), dRate = $("d-rate"), dRate2 = $("d-rate2"),
      dChain = $("d-chain"), dChainField = $("d-chain-field"),
      dHint = $("d-hint"), dNote = $("d-note"), dFlow = $("d-flow"),
      dCopyBox = $("d-copybox"), dCopyBtn = $("d-copy"),
      dSendBtns = [$("d-tocalc"), $("d-tofx"), $("d-torev")],
      dPadTarget = $("d-pad-target");
  var dState = { text: "", value: NaN };
  var dInputs = [dAmount, dRate, dRate2];
  var dActive, dPad;

  function clearDiscount(msg, isError){
    $("d-final").textContent = "—";
    $("d-savebar").textContent = "—";
    $("d-r-amount").textContent = "—";
    $("d-r-rate").textContent = "—";
    $("d-r-disc").textContent = "—";
    $("d-r-eff").textContent = "—";
    dFlow.innerHTML = "";
    dNote.hidden = true;
    dHint.textContent = msg || "";
    dHint.className = "hint" + (isError ? " error" : "");
    dState.text = "";
    dState.value = NaN;
    dCopyBtn.disabled = true;
    dSendBtns.forEach(function(b){ b.disabled = true; });
    dCopyBox.hidden = true;
    syncClearButtons(panelD);
  }

  function calcDiscount(){
    var amountStr = digitsOnly(dAmount.value);
    var rateStr = dRate.value.trim();
    var rate = parseFloat(rateStr);
    var messages = [];

    dChainField.hidden = !dChain.checked;
    syncQuick($("d-quick"), isFinite(rate) ? rate : NaN);
    syncClearButtons(panelD);

    if (amountStr === ""){ clearDiscount("", false); return; }
    var amount = parseInt(amountStr, 10);
    if (!isFinite(amount)){ clearDiscount("금액을 숫자로 입력하세요.", true); return; }

    if (rateStr === "" || !isFinite(rate)) rate = 0;
    if (rate < 0){ rate = 0; messages.push("할인율은 0% 미만이 될 수 없습니다."); }
    if (rate > 100){ rate = 100; messages.push("할인율은 100%까지만 적용됩니다."); }

    var rate2 = 0;
    if (dChain.checked){
      var r2s = dRate2.value.trim();
      rate2 = parseFloat(r2s);
      if (r2s === "" || !isFinite(rate2)) rate2 = 0;
      if (rate2 < 0){ rate2 = 0; messages.push("추가 할인율은 0% 미만이 될 수 없습니다."); }
      if (rate2 > 100){ rate2 = 100; messages.push("추가 할인율은 100%까지만 적용됩니다."); }
    }

    var disc1 = Math.round(amount * rate / 100);
    var mid = amount - disc1;
    var disc2 = Math.round(mid * rate2 / 100);
    var final = mid - disc2;
    var totalDisc = amount - final;
    var eff = amount > 0 ? (totalDisc / amount) * 100 : 0;

    $("d-final").innerHTML = wonBig(final);
    $("d-savebar").textContent = "-" + won(totalDisc);
    $("d-r-amount").textContent = won(amount);
    $("d-r-rate").textContent = dChain.checked && rate2 > 0 ? (pct(rate) + " + " + pct(rate2)) : pct(rate);
    $("d-r-disc").textContent = "-" + won(totalDisc);
    $("d-r-eff").textContent = pct(eff);

    if (dChain.checked && rate2 > 0){
      flowNode(dFlow, [
        { type:"amt", text: won(amount) },
        { type:"step", text: pct(rate) + " 할인" },
        { type:"amt", text: won(mid), dim:true },
        { type:"step", text: "추가 " + pct(rate2) + " 할인" },
        { type:"amt", text: won(final) }
      ]);
      var sumRate = Math.min(100, rate + rate2);
      var sumFinal = amount - Math.round(amount * sumRate / 100);
      var gap = final - sumFinal;
      dNote.hidden = false;
      dNote.innerHTML = "연속 할인은 " + pct(sumRate) + " 단일 할인과 다릅니다. " +
        pct(sumRate) + " 단일 할인 시 <b>" + won(sumFinal) + "</b>, 연속 할인 시 <b>" + won(final) + "</b> — " +
        (gap === 0 ? "결과가 같습니다." : "연속 할인이 <b>" + won(Math.abs(gap)) + "</b> " + (gap > 0 ? "더 비쌉니다." : "더 쌉니다.")) +
        " 실질 할인율은 " + pct(eff) + "입니다.";
    } else {
      flowNode(dFlow, [
        { type:"amt", text: won(amount) },
        { type:"step", text: pct(rate) + " 할인" },
        { type:"amt", text: won(final) }
      ]);
      dNote.hidden = true;
    }

    dHint.textContent = messages.join(" ");
    dHint.className = "hint" + (messages.length ? " error" : "");

    dState.text =
      "원금: " + won(amount) + "\n" +
      "할인율: " + (dChain.checked && rate2 > 0 ? pct(rate) + " + " + pct(rate2) + " (연속)" : pct(rate)) + "\n" +
      "할인금액: " + won(totalDisc) + "\n" +
      "최종금액: " + won(final);
    dState.value = final;
    dCopyBtn.disabled = false;
    dSendBtns.forEach(function(b){ b.disabled = false; });
  }

  function onDiscountSwitch(){
    var el = dActive.get();
    markActive(dInputs, el);
    dPadTarget.textContent = el ? (el.dataset.name || "") : "";
    if (dPad) dPad.sync();
  }

  bindAmount(dAmount, calcDiscount);
  bindRate(dRate, calcDiscount);
  bindRate(dRate2, calcDiscount);
  dChain.addEventListener("change", function(){
    calcDiscount();
    if (dChain.checked) dActive.set(dRate2);
    else if (dActive.get() === dRate2) dActive.set(dAmount);
  });
  buildQuick($("d-quick"), dRate, calcDiscount);
  bindClearButtons(panelD, calcDiscount);
  dActive = trackActive(dInputs, onDiscountSwitch);
  dPad = makeKeypad($("d-keypad"), function(){ return dActive.get(); }, calcDiscount,
                    function(){ stepTarget(dActive, dInputs); });
  bindPaste($("d-paste"), function(){ return dActive.get(); }, calcDiscount);

  $("d-reset").addEventListener("click", function(){
    dAmount.value = ""; dRate.value = ""; dRate2.value = ""; dChain.checked = false;
    dCopyBox.hidden = true;
    dActive.set(dAmount);
    calcDiscount();
  });
  var dCopyFlash = makeFlash(dCopyBtn);
  dCopyBtn.addEventListener("click", function(){
    if (!dState.text) return;
    copyText(dState.text, dCopyBox, dCopyFlash);
  });
  /* 결과를 다른 탭으로 — 실패하면 버튼에 사유를 잠깐 띄운다 */
  function bindSend(btn, fn, getValue){
    var flash = makeFlash(btn);
    btn.addEventListener("click", function(){
      var r = fn(getValue());
      if (r !== "ok" && r !== "rounded") flash(r);
    });
  }
  function dValue(){ return dState.value; }
  bindSend($("d-tocalc"), sendToCalc,    dValue);
  bindSend($("d-tofx"),   sendToFx,      dValue);
  bindSend($("d-torev"),  sendToReverse, dValue);

  /* ================= 원금 역산 ================= */
  var panelR = $("panel-reverse");
  var rFinal = $("r-final"), rRate = $("r-rate"), rHint = $("r-hint"), rFlow = $("r-flow"),
      rCopyBox = $("r-copybox"), rCopyBtn = $("r-copy"),
      rSendBtns = [$("r-todisc"), $("r-tocalc"), $("r-tofx")],
      rPadTarget = $("r-pad-target");
  var rState = { text: "", value: NaN };
  var rInputs = [rFinal, rRate];
  var rActive, rPad;

  function clearReverse(msg, isError){
    $("r-origin").textContent = "—";
    $("r-savebar").textContent = "—";
    $("r-r-final").textContent = "—";
    $("r-r-rate").textContent = "—";
    $("r-r-disc").textContent = "—";
    rFlow.innerHTML = "";
    rHint.textContent = msg || "";
    rHint.className = "hint" + (isError ? " error" : "");
    rState.text = "";
    rState.value = NaN;
    rCopyBtn.disabled = true;
    rSendBtns.forEach(function(b){ b.disabled = true; });
    rCopyBox.hidden = true;
    syncClearButtons(panelR);
  }

  function calcReverse(){
    var finalStr = digitsOnly(rFinal.value);
    var rateStr = rRate.value.trim();
    var rate = parseFloat(rateStr);
    var messages = [];

    syncQuick($("r-quick"), isFinite(rate) ? rate : NaN);
    syncClearButtons(panelR);

    if (finalStr === ""){ clearReverse("", false); return; }
    var finalAmt = parseInt(finalStr, 10);
    if (!isFinite(finalAmt)){ clearReverse("금액을 숫자로 입력하세요.", true); return; }

    if (rateStr === "" || !isFinite(rate)) rate = 0;
    if (rate < 0){ rate = 0; messages.push("할인율은 0% 미만이 될 수 없습니다."); }
    if (rate >= 100){
      clearReverse("할인율이 100%이면 원금을 계산할 수 없습니다. 100% 미만으로 입력하세요.", true);
      return;
    }

    var origin = Math.round(finalAmt / (1 - rate / 100));
    var disc = origin - finalAmt;

    $("r-origin").innerHTML = wonBig(origin);
    $("r-savebar").textContent = "-" + won(disc);
    $("r-r-final").textContent = won(finalAmt);
    $("r-r-rate").textContent = pct(rate);
    $("r-r-disc").textContent = "-" + won(disc);

    flowNode(rFlow, [
      { type:"amt", text: won(origin) },
      { type:"step", text: pct(rate) + " 할인" },
      { type:"amt", text: won(finalAmt), dim:true }
    ]);

    rHint.textContent = messages.join(" ");
    rHint.className = "hint" + (messages.length ? " error" : "");

    rState.text =
      "최종금액: " + won(finalAmt) + "\n" +
      "할인율: " + pct(rate) + "\n" +
      "할인금액: " + won(disc) + "\n" +
      "원금: " + won(origin);
    rState.value = origin;
    rCopyBtn.disabled = false;
    rSendBtns.forEach(function(b){ b.disabled = false; });
  }

  function onReverseSwitch(){
    var el = rActive.get();
    markActive(rInputs, el);
    rPadTarget.textContent = el ? (el.dataset.name || "") : "";
    if (rPad) rPad.sync();
  }

  bindAmount(rFinal, calcReverse);
  bindRate(rRate, calcReverse);
  buildQuick($("r-quick"), rRate, calcReverse);
  bindClearButtons(panelR, calcReverse);
  rActive = trackActive(rInputs, onReverseSwitch);
  rPad = makeKeypad($("r-keypad"), function(){ return rActive.get(); }, calcReverse,
                    function(){ stepTarget(rActive, rInputs); });
  bindPaste($("r-paste"), function(){ return rActive.get(); }, calcReverse);

  $("r-reset").addEventListener("click", function(){
    rFinal.value = ""; rRate.value = "";
    rCopyBox.hidden = true;
    rActive.set(rFinal);
    calcReverse();
  });
  var rCopyFlash = makeFlash(rCopyBtn);
  rCopyBtn.addEventListener("click", function(){
    if (!rState.text) return;
    copyText(rState.text, rCopyBox, rCopyFlash);
  });
  function rValue(){ return rState.value; }
  bindSend($("r-todisc"), sendToAmount, rValue);
  bindSend($("r-tocalc"), sendToCalc,   rValue);
  bindSend($("r-tofx"),   sendToFx,     rValue);

  /* ================= 일반 계산 ================= */
  var panelC = $("panel-calc");
  var cExprEl = $("c-expr"), cEntryEl = $("c-entry"),
      cCopyBox = $("c-copybox"), cCopyBtn = $("c-copy");

  var cAcc = null;     // 누적값
  var cOp = null;      // 대기 중인 연산자
  var cEntry = "0";    // 현재 입력
  var cFresh = true;   // 표시값이 아직 피연산자가 아님 (연산자 직후)
  var cReplace = false;// 표시값은 피연산자지만 다음 숫자가 덮어씀 (단항 연산 직후)
  var cDone = false;   // 직전에 = 를 눌렀는가
  var cError = false;
  var cTrail = [];     // 지금까지 누른 식 ["100", "+", "200", "+"]
  var cTermLabel = null; // 단항 연산이 만든 항 표시 (예: sqr(7))

  var OPSYM = { "+":"+", "-":"−", "*":"×", "/":"÷" };

  /* 유효숫자 12자리로 잘라 2진 부동소수점 잔차를 없앤다.
     (Math.round(n*1e10)/1e10 은 n 이 크면 안전 정수 범위를 넘어 무력해진다) */
  function trimNum(n){
    if (!isFinite(n) || n === 0) return "0";
    return String(Number(n.toPrecision(12)));
  }

  function commaInt(s){
    if (s.indexOf("e") !== -1 || s.indexOf("E") !== -1) return s;
    var neg = s.charAt(0) === "-";
    var t = neg ? s.slice(1) : s;
    var parts = t.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }
  function fmtNum(n){
    if (!isFinite(n)) return "—";
    var s = trimNum(n);
    if (s.indexOf("e") !== -1) return Number(s).toExponential(6);
    return commaInt(s);
  }

  /* 식이 길어지면 앞을 줄임표로 접는다 — 디스플레이가 세로로 늘어나지 않게 */
  function cTrailText(extra){
    var parts = cTrail.slice();
    if (extra) parts.push(extra);
    if (!parts.length) return "";
    var shown = parts.length > 9 ? ["\u2026"].concat(parts.slice(-9)) : parts;
    return shown.join(" ");
  }

  function cRender(){
    cError = false;
    cEntryEl.textContent = commaInt(cEntry);
    var line = cTrailText();
    cExprEl.innerHTML = line ? "" : "&nbsp;";
    if (line) cExprEl.textContent = line;
    cCopyBtn.disabled = false;
  }
  function cFail(msg){
    cAcc = null; cOp = null; cEntry = "0"; cFresh = true; cReplace = false; cDone = false; cError = true;
    cTrail = []; cTermLabel = null;
    cEntryEl.textContent = "—";
    cExprEl.textContent = msg;
    cCopyBtn.disabled = true;
  }

  function cCompute(a, op, b){
    if (op === "+") return a + b;
    if (op === "-") return a - b;
    if (op === "*") return a * b;
    if (op === "/") return b === 0 ? NaN : a / b;
    return b;
  }

  function cDigit(d){
    if (cError) { cEntry = "0"; cFresh = true; }
    if (cDone){ cAcc = null; cOp = null; cDone = false; cFresh = true; cTrail = []; }
    cTermLabel = null;
    if (cFresh || cReplace){
      cEntry = (d === "00") ? "0" : d;
      cFresh = false; cReplace = false;
    } else if (cEntry === "0"){
      if (d !== "00") cEntry = d;
    } else if (cEntry === "-0"){
      if (d !== "00") cEntry = "-" + d;
    } else {
      cEntry += d;
    }
    if (cEntry.replace(/[^0-9]/g, "").length > 14) cEntry = cEntry.slice(0, -1);
    cRender();
  }

  function cDot(){
    if (cError){ cEntry = "0"; cFresh = false; }
    if (cDone){ cAcc = null; cOp = null; cDone = false; cEntry = "0"; cFresh = false; cTrail = []; }
    cTermLabel = null;
    if (cFresh || cReplace){ cEntry = "0"; cFresh = false; cReplace = false; }
    if (cEntry.indexOf(".") === -1) cEntry += ".";
    cRender();
  }

  function cBack(){
    if (cError){ cClear(); return; }
    if (cDone || cFresh) return;
    cEntry = cEntry.slice(0, -1);
    if (cEntry === "" || cEntry === "-") cEntry = "0";
    cReplace = false; cTermLabel = null;
    cRender();
  }

  /* CE — 현재 입력만 지움 (대기 중인 연산은 유지) */
  function cClearEntry(){
    if (cError){ cClear(); return; }
    cEntry = "0"; cFresh = false; cReplace = false; cDone = false; cTermLabel = null;
    cRender();
  }

  function cSetOp(op){
    if (cError) return;
    var v = parseFloat(cEntry);
    var term = cTermLabel || fmtNum(v);

    if (cFresh && !cDone && cTrail.length){
      cTrail[cTrail.length - 1] = OPSYM[op];   // 연산자 연속 입력 → 마지막 것만 교체
    } else {
      if (cDone) cTrail = [term];              // = 직후면 결과에서 새 식 시작
      else cTrail.push(term);
      cTrail.push(OPSYM[op]);
    }

    if (cAcc === null || cDone) cAcc = v;
    else if (!cFresh) cAcc = cCompute(cAcc, cOp, v);
    if (!isFinite(cAcc)){ cFail("0으로 나눌 수 없습니다"); return; }
    cOp = op; cFresh = true; cReplace = false; cDone = false; cTermLabel = null;
    cEntry = trimNum(cAcc);
    cRender();
  }

  function cEquals(){
    if (cError) return;
    if (cOp === null){ cDone = true; cRender(); return; }
    var v = parseFloat(cEntry);
    var term = cTermLabel || fmtNum(v);
    cTrail.push(term);
    var line = cTrail.join(" ") + " =";
    var res = cCompute(cAcc, cOp, v);
    cAcc = null; cOp = null; cFresh = true; cReplace = false; cDone = true;
    cTrail = []; cTermLabel = null;
    if (!isFinite(res)){ cFail("0으로 나눌 수 없습니다"); return; }
    cEntry = trimNum(res);
    cEntryEl.textContent = commaInt(cEntry);
    cExprEl.textContent = line;
    cCopyBtn.disabled = false;
    histAdd(line, cEntry);
  }

  function cPercent(){
    if (cError) return;
    /* % 는 100으로 나누기다. 식에 "50%" 로 적으면 "앞 항의 50%"(윈도우 방식)로
       오해할 수 있어, 변환된 숫자를 그대로 항으로 쓴다. */
    cEntry = trimNum(parseFloat(cEntry) / 100);
    cFresh = false; cReplace = true; cDone = false; cTermLabel = null;
    cRender();
  }

  /* k — 현재 표시값에 1,000을 곱한다. 연산자를 막 누른 직후(피연산자 미입력)에는 동작하지 않는다. */
  function cKilo(){
    if (cError) return;
    if (cFresh && !cDone) return;          // 연산자 직후 — 곱할 값이 아직 없다
    var v = parseFloat(cEntry);
    if (!isFinite(v)) return;
    if (cDone){ cAcc = null; cOp = null; cDone = false; cTrail = []; }
    cEntry = trimNum(v * 1000);
    /* k 는 자릿수 단축키이므로 뒤이어 누른 숫자는 덮어쓰지 않고 이어 붙인다 */
    cFresh = false; cReplace = false; cTermLabel = null;
    cRender();
  }

  function cSign(){
    if (cError) return;
    if (cEntry === "0") return;
    cEntry = cEntry.charAt(0) === "-" ? cEntry.slice(1) : "-" + cEntry;
    cFresh = false; cTermLabel = null;
    cRender();
  }

  function cClear(){
    cAcc = null; cOp = null; cEntry = "0"; cFresh = true; cReplace = false; cDone = false;
    cTrail = []; cTermLabel = null;
    cCopyBox.hidden = true;
    cRender();
  }

  var CALC_KEYS = [
    { t:".", aria:"소수점" },
    { t:"C", act:"clear", fn:true, aria:"전체 지우기" },
    { t:"←", act:"back", fn:true, aria:"한 글자 지우기" },
    { t:"÷", act:"op", op:"/", opk:true, aria:"나누기" },
    { t:"7" }, { t:"8" }, { t:"9" }, { t:"×", act:"op", op:"*", opk:true, aria:"곱하기" },
    { t:"4" }, { t:"5" }, { t:"6" }, { t:"−", act:"op", op:"-", opk:true, aria:"빼기" },
    { t:"1" }, { t:"2" }, { t:"3" }, { t:"+", act:"op", op:"+", opk:true, aria:"더하기" },
    { t:"00" }, { t:"0" }, { t:"k", act:"kilo", fn:true, aria:"1,000 곱하기" }, { t:"=", act:"eq", eqk:true, aria:"계산" }
  ];

  (function buildCalcPad(){
    var host = $("c-keypad");
    CALC_KEYS.forEach(function(def){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "key" + (def.fn ? " fn" : "") + (def.opk ? " op" : "") + (def.eqk ? " eq" : "");
      b.textContent = def.t;
      if (def.aria) b.setAttribute("aria-label", def.aria);
      b.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
      b.addEventListener("click", function(){
        if (def.act === "clear") cClear();
        else if (def.act === "ce") cClearEntry();
        else if (def.act === "back") cBack();
        else if (def.act === "kilo") cKilo();
        else if (def.act === "op") cSetOp(def.op);
        else if (def.act === "eq") cEquals();
        else if (def.t === ".") cDot();
        else cDigit(def.t);
      });
      host.appendChild(b);
    });
  })();

  $("c-sign").addEventListener("mousedown", function(ev){ ev.preventDefault(); });
  $("c-sign").addEventListener("click", cSign);
  $("c-pct").addEventListener("mousedown", function(ev){ ev.preventDefault(); });
  $("c-pct").addEventListener("click", cPercent);

  /* ---------- 최근 계산 목록 (일반 계산 / 환율 공용) ---------- */
  var HIST_MAX = 10;

  /* actions: [{ label, run(item, flash) }] — 줄마다 항상 보이는 버튼
     menu:    [{ label, run(item, flash) }] — "보내기"를 눌렀을 때만 펼쳐지는 선택지 */
  function makeHistory(listEl, clearBtn, editBtn, storageKey, emptyText, actions, menu, onPick){
    var items = [], editing = false, openIdx = -1;
    try {
      var raw = localStorage.getItem(storageKey);
      if (raw){
        var parsed = JSON.parse(raw);
        if (Object.prototype.toString.call(parsed) === "[object Array]"){
          parsed.forEach(function(it){
            if (it && typeof it.expr === "string" && typeof it.val === "string") items.push(it);
          });
        }
      }
    } catch(e){ items = []; }
    /* 보관 개수를 줄였을 때 이전에 쌓인 기록도 불러올 때 잘라낸다 */
    if (items.length > HIST_MAX) items.length = HIST_MAX;

    function save(){
      try { localStorage.setItem(storageKey, JSON.stringify(items.slice(0, HIST_MAX))); } catch(e){}
    }

    function render(){
      listEl.innerHTML = "";
      if (!items.length){ editing = false; openIdx = -1; }
      if (editing) openIdx = -1;
      clearBtn.hidden = items.length === 0;
      editBtn.hidden = items.length === 0;
      editBtn.textContent = editing ? "완료" : "편집";
      editBtn.setAttribute("aria-pressed", editing ? "true" : "false");
      if (!items.length){
        var empty = document.createElement("p");
        empty.className = "histempty";
        empty.textContent = emptyText;
        listEl.appendChild(empty);
        return;
      }
      items.forEach(function(item, idx){
        var row = document.createElement("div");
        row.className = "histrow";

        /* 기록 줄을 누르면 그 항목을 현재 계산으로 불러온다 (편집 중에는 비활성) */
        var pickable = !editing && typeof onPick === "function";
        var main = document.createElement(pickable ? "button" : "div");
        main.className = "histmain" + (pickable ? " histpick" : "");
        if (pickable){
          main.type = "button";
          main.setAttribute("aria-label", (item.label || commaInt(item.val)) + " 현재 계산으로 불러오기");
          main.addEventListener("click", function(){ onPick(item); });
        }
        var e = document.createElement("span");
        e.className = "hexpr";
        e.textContent = item.expr;
        var v = document.createElement("span");
        v.className = "hval";
        v.textContent = item.label || commaInt(item.val);
        main.appendChild(e);
        main.appendChild(v);

        var box = document.createElement("div");
        box.className = "histactions";
        if (editing){
          var del = document.createElement("button");
          del.type = "button";
          del.className = "histsend histdel";
          del.textContent = "삭제";
          del.setAttribute("aria-label", (item.label || commaInt(item.val)) + " 삭제");
          del.addEventListener("click", function(){
            items.splice(idx, 1);
            save();
            render();
          });
          box.appendChild(del);
        } else {
          var name = item.label || commaInt(item.val);
          actions.forEach(function(act){
            var send = document.createElement("button");
            send.type = "button";
            send.className = "histsend";
            send.textContent = act.label;
            send.setAttribute("aria-label", name + " " + act.label);
            var flash = makeFlash(send);
            send.addEventListener("click", function(){ act.run(item, flash); });
            box.appendChild(send);
          });

          if (menu && menu.length){
            var open = openIdx === idx;
            var more = document.createElement("button");
            more.type = "button";
            more.className = "histsend" + (open ? " open" : "");
            more.textContent = open ? "보내기 ▴" : "보내기 ▾";
            more.setAttribute("aria-expanded", open ? "true" : "false");
            more.setAttribute("aria-label", name + " 보내기");
            more.addEventListener("click", function(){
              openIdx = open ? -1 : idx;
              render();
            });
            box.appendChild(more);
          }
        }

        row.appendChild(main);
        row.appendChild(box);

        if (!editing && menu && menu.length && openIdx === idx){
          var menuBox = document.createElement("div");
          menuBox.className = "histmenu";
          menu.forEach(function(act){
            var b = document.createElement("button");
            b.type = "button";
            b.className = "histsend";
            b.textContent = act.label;
            b.setAttribute("aria-label", (item.label || commaInt(item.val)) + " " + act.label);
            var flash = makeFlash(b);
            b.addEventListener("click", function(){
              var msg = act.run(item, flash);
              if (msg !== false){ openIdx = -1; render(); }
            });
            menuBox.appendChild(b);
          });
          row.appendChild(menuBox);
        }

        listEl.appendChild(row);
      });
    }

    clearBtn.addEventListener("click", function(){ items = []; editing = false; openIdx = -1; save(); render(); });
    editBtn.addEventListener("click", function(){ editing = !editing; openIdx = -1; render(); });

    return {
      add: function(expr, val, label, extra){
        if (items.length && items[0].val === val && items[0].expr === expr) return;
        var it = { expr: expr, val: val };
        if (label) it.label = label;
        if (extra){ for (var k in extra){ if (Object.prototype.hasOwnProperty.call(extra, k)) it[k] = extra[k]; } }
        items.unshift(it);
        if (items.length > HIST_MAX) items.length = HIST_MAX;
        editing = false; openIdx = -1;
        save();
        render();
      },
      render: render
    };
  }

  var calcHistory = makeHistory($("c-history"), $("c-hist-clear"), $("c-hist-edit"),
                                "discount-calc-history", "아직 계산 기록이 없습니다.",
                                /* 항상 보이는 버튼 — 식과 결과를 함께 복사한다 */
                                [
                                  { label: "복사", run: function(item, flash){
                                      copyText(histText(item), cCopyBox, flash);
                                    } }
                                ],
                                /* "보내기"를 눌렀을 때 펼쳐지는 선택지 */
                                [
                                  { label: "할인 →", run: function(item, flash){ return sendFrom(sendToAmount, item, flash); } },
                                  { label: "환율 →", run: function(item, flash){ return sendFrom(sendToFx, item, flash); } },
                                  { label: "역산 →", run: function(item, flash){ return sendFrom(sendToReverse, item, flash); } }
                                ],
                                cLoad);

  /* 기록 한 줄을 "식 결과" 한 문장으로 — expr 끝에 이미 "=" 가 들어 있다 */
  function histText(item){
    var val = item.label || commaInt(item.val);
    var expr = item.expr || "";
    if (!expr) return val;
    return /[=→]\s*$/.test(expr) ? expr + " " + val : expr + " = " + val;
  }

  /* 실패하면 false 를 돌려 메뉴를 열어 둔 채 사유를 보여 준다 */
  function sendFrom(fn, item, flash){
    var r = fn(parseFloat(item.val));
    if (r !== "ok" && r !== "rounded"){ flash(r); return false; }
    return true;
  }
  function histAdd(expr, val){ calcHistory.add(expr, val); }
  function histRender(){ calcHistory.render(); }

  /* ---------- 계산 결과를 할인 계산 탭의 원금으로 ---------- */
  function sendToAmount(v){
    if (!isFinite(v)) return "결과 없음";
    if (v < 0) return "음수는 불가";
    var rounded = Math.round(v);
    if (rounded === 0) return "0은 불가";

    dAmount.value = String(rounded);
    fireInput(dAmount);
    calcDiscount();
    selectTab("discount");
    /* 원금은 채워졌으니 다음 차례인 할인율로 커서를 옮긴다.
       모바일 입력칸은 read-only라 포커스를 줘도 시스템 키보드는 올라오지 않는다. */
    dActive.set(dRate);
    try { dRate.focus({ preventScroll: true }); } catch(e){ dRate.focus(); }
    return v === rounded ? "ok" : "rounded";
  }

  /* 값을 원금 역산 탭의 "최종 결제금액"으로 올리고 그 탭으로 전환 */
  function sendToReverse(v){
    if (!isFinite(v)) return "결과 없음";
    if (v < 0) return "음수는 불가";
    var rounded = Math.round(v);
    if (rounded === 0) return "0은 불가";

    rFinal.value = String(rounded);
    fireInput(rFinal);
    calcReverse();
    selectTab("reverse");
    rActive.set(rRate);
    try { rRate.focus({ preventScroll: true }); } catch(e){ rRate.focus(); }
    return v === rounded ? "ok" : "rounded";
  }

  /* 값을 환율 탭 금액으로 올리고 그 탭으로 전환 */
  function sendToFx(v){
    if (!isFinite(v)) return "결과 없음";
    if (v < 0) return "음수는 불가";
    fAmount.value = groupDecimal(trimNum(v));
    fireInput(fAmount);
    fxCalc();
    selectTab("fx");
    return "ok";
  }

  /* 기록 항목을 계산기의 현재 값으로 올린다 — "=" 를 막 누른 직후와 같은 상태 */
  function cLoad(item){
    var v = parseFloat(item.val);
    if (!isFinite(v)) return;
    cAcc = null; cOp = null; cTrail = []; cTermLabel = null;
    cEntry = trimNum(v);
    cFresh = true; cReplace = false; cDone = true; cError = false;
    cEntryEl.textContent = commaInt(cEntry);
    var line = item.expr || "";
    cExprEl.innerHTML = line ? "" : "&nbsp;";
    if (line) cExprEl.textContent = line;
    cCopyBtn.disabled = false;
    cCopyBox.hidden = true;
  }

  /* 값을 일반 계산 탭으로 올리고 그 탭으로 전환 */
  function sendToCalc(v){
    if (!isFinite(v)) return "결과 없음";
    cLoad({ val: String(v), expr: "" });
    selectTab("calc");
    return "ok";
  }

  (function bindCalcPaste(){
    var btn = $("c-paste");
    var flash = makeFlash(btn);
    btn.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
    btn.addEventListener("click", function(){
      if (!navigator.clipboard || !navigator.clipboard.readText){ flash("지원 안 됨"); return; }
      navigator.clipboard.readText().then(function(text){
        var picked = pickNumber(text);
        var neg = picked.charAt(0) === "-";
        var clean = decimalOnly(picked).replace(/^\.+/, "");
        if (!clean){ flash("숫자 없음"); return; }
        /* 자릿수 한도는 직접 입력할 때와 같게 */
        while (clean.replace(/[^0-9]/g, "").length > 14) clean = clean.slice(0, -1);
        clean = clean.replace(/\.$/, "");
        cEntry = (neg ? "-" : "") + clean;
        cFresh = false; cDone = false; cTermLabel = null;
        cRender();
        flash("붙여넣음 ✓");
      }, function(){ flash("권한 거부"); });
    });
  })();

  (function bindCalcSendButtons(){
    [["c-send-d", sendToAmount], ["c-send-f", sendToFx], ["c-send-r", sendToReverse]].forEach(function(pair){
      var btn = $(pair[0]), send = pair[1], flash = makeFlash(btn);
      btn.addEventListener("click", function(){
        if (cError){ flash("결과 없음"); return; }
        var r = send(parseFloat(cEntry));
        flash(r === "ok" ? "보냈습니다 ✓" : r === "rounded" ? "반올림해 보냄 ✓" : r);
      });
    });
  })();

  var cCopyFlash = makeFlash(cCopyBtn);
